name: Canli v1

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.V1_DEPLOY_KEY }}

      - name: Sunucuyu tan
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H 186.240.158.199 >> ~/.ssh/known_hosts

      - name: Dosyalari kopyala
        run: |
          rsync -az --delete \
            --exclude node_modules \
            --exclude .git \
            --exclude yedekler \
            --exclude .wrangler \
            --exclude .sites-runtime \
            --exclude dist \
            --exclude .vinext \
            --exclude .next \
            --exclude .cursor \
            --exclude .codex \
            --exclude "*.rar" \
            --exclude "*.zip" \
            ./ root@186.240.158.199:/home/avccom/yeni/v1/app/

      - name: V2 yonetim sirlarini aktar
        env:
          ADMIN_LOGIN_EMAIL: ${{ secrets.V2_ADMIN_LOGIN_EMAIL }}
          ADMIN_LOGIN_PASSWORD: ${{ secrets.V2_ADMIN_LOGIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.V2_ADMIN_SESSION_SECRET }}
        run: |
          {
            printf 'ADMIN_LOGIN_EMAIL=%s\n' "$ADMIN_LOGIN_EMAIL"
            printf 'ADMIN_LOGIN_PASSWORD=%s\n' "$ADMIN_LOGIN_PASSWORD"
            printf 'ADMIN_SESSION_SECRET=%s\n' "$ADMIN_SESSION_SECRET"
          } | ssh root@186.240.158.199 "umask 077; mkdir -p /home/avccom/yeni; cat > /home/avccom/yeni/admin-runtime.env"

      - name: Derle ve servisi ac
        run: ssh root@186.240.158.199 "bash /home/avccom/yeni/v1/app/scripts/deploy-v1.sh"
