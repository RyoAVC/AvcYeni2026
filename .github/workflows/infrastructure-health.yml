name: Altyapi saglik kontrolu

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Lisansli sitelerin HTTP ve SSL durumunu kontrol et
        env:
          INFRASTRUCTURE_WORKER_SECRET: ${{ secrets.INFRASTRUCTURE_WORKER_SECRET }}
        run: |
          if [ -z "$INFRASTRUCTURE_WORKER_SECRET" ]; then
            echo "INFRASTRUCTURE_WORKER_SECRET tanımlı değil." >&2
            exit 1
          fi
          response="$(curl -fsS --max-time 240 \
            -H "X-Avci-Infrastructure-Worker: $INFRASTRUCTURE_WORKER_SECRET" \
            -X POST https://yeni.avcieticaret.com/v2/api/v1/control-desk/infrastructure/checks)"
          node -e 'const body=JSON.parse(process.argv[1]);if(!body.ok)process.exit(1);console.log(`checked:${body.checked}`)' "$response"
