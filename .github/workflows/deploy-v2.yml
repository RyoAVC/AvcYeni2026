name: Canli v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.V1_DEPLOY_KEY }}

      - name: Sunucuyu tanı
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -H 186.240.158.199 >> ~/.ssh/known_hosts; then break; fi
            sleep $((attempt * 2))
          done
          test -s ~/.ssh/known_hosts

      - name: V2 kaynaklarını kopyala
        run: |
          rsync -az --delete \
            --exclude node_modules \
            --exclude .git \
            --exclude .dev.vars \
            --exclude yedekler \
            --exclude .wrangler \
            --exclude .sites-runtime \
            --exclude dist \
            --exclude .vinext \
            --exclude .next \
            --exclude .cursor \
            --exclude .codex \
            --exclude .codex-runtime \
            --exclude tmp \
            --exclude "Avcı E-Ticaret Canlı" \
            --exclude "*.rar" \
            --exclude "*.zip" \
            ./ root@186.240.158.199:/home/avccom/yeni/v2/app/

      - name: Hostinger sırrını sunucu kasasına aktar
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          INFRASTRUCTURE_WORKER_SECRET: ${{ secrets.INFRASTRUCTURE_WORKER_SECRET }}
        run: |
          if [ -z "$HOSTINGER_API_TOKEN" ] || [ -z "$INFRASTRUCTURE_WORKER_SECRET" ]; then
            echo "Gerekli altyapı secret değerleri GitHub'da tanımlı değil." >&2
            exit 1
          fi
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          chmod 600 "$secret_file"
          printf '%s' "$HOSTINGER_API_TOKEN" > "$secret_file"
          scp "$secret_file" root@186.240.158.199:/tmp/avci-hostinger-token
          ssh root@186.240.158.199 'set -euo pipefail; trap '\''rm -f /tmp/avci-hostinger-token'\'' EXIT; vars=/home/avccom/yeni/v2/app/.dev.vars; touch "$vars"; sed -i '\''/^HOSTINGER_API_TOKEN=/d'\'' "$vars"; printf '\''HOSTINGER_API_TOKEN=%s\n'\'' "$(cat /tmp/avci-hostinger-token)" >> "$vars"; chmod 600 "$vars"'
          printf '%s' "$INFRASTRUCTURE_WORKER_SECRET" > "$secret_file"
          scp "$secret_file" root@186.240.158.199:/tmp/avci-infrastructure-worker-secret
          ssh root@186.240.158.199 'set -euo pipefail; trap '\''rm -f /tmp/avci-infrastructure-worker-secret'\'' EXIT; vars=/home/avccom/yeni/v2/app/.dev.vars; touch "$vars"; sed -i '\''/^INFRASTRUCTURE_WORKER_SECRET=/d'\'' "$vars"; printf '\''INFRASTRUCTURE_WORKER_SECRET=%s\n'\'' "$(cat /tmp/avci-infrastructure-worker-secret)" >> "$vars"; chmod 600 "$vars"'

      - name: Derle, servisi aç ve sağlığı doğrula
        run: ssh root@186.240.158.199 "bash /home/avccom/yeni/v2/app/scripts/deploy-v2.sh"

      - name: Hostinger read-only API bağlantısını doğrula
        run: |
          ssh root@186.240.158.199 'bash -s' <<'REMOTE'
          set -euo pipefail
          vars=/home/avccom/yeni/v2/app/.dev.vars
          token_line="$(grep '^HOSTINGER_API_TOKEN=.' "$vars" | tail -n 1 || true)"
          if [ -z "$token_line" ]; then
            echo "HOSTINGER_API_TOKEN sunucuda tanımlı değil." >&2
            exit 1
          fi
          token="${token_line#HOSTINGER_API_TOKEN=}"
          for endpoint in /api/hosting/v1/websites /api/vps/v1/virtual-machines; do
            code="$(printf 'header = "Authorization: Bearer %s"\n' "$token" | curl --config - -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://developers.hostinger.com${endpoint}")"
            echo "hostinger_${endpoint##*/}:${code}"
            if [ "$code" != "200" ]; then
              echo "Hostinger read-only API doğrulaması başarısız: ${endpoint}" >&2
              exit 1
            fi
          done
          REMOTE
